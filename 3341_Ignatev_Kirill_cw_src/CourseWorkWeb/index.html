<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курсовая работа - Игра</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="menu-screen" class="screen active">
            <video id="menu-video" autoplay muted loop playsinline>
                <source src="assets/videos/main_screen.mp4" type="video/mp4">
            </video>
            <div class="menu-content">
                <button id="start-btn" class="btn">Начать игру</button>
                <button id="scores-btn" class="btn">Таблица рекордов</button>
                <button id="settings-btn" class="btn">Настройки</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <canvas id="game-canvas"></canvas>
            <div id="hud">
                <div>Уровень: <span id="level-display">1</span></div>
                <div>Очки: <span id="score-display">0</span></div>
                <div>Жизни: <span id="lives-display">3</span></div>
            </div>
        </div>

        <div id="scores-screen" class="screen">
            <h2>Таблица рекордов</h2>
            <div id="scores-list"></div>
            <button id="back-from-scores-btn" class="btn">Назад</button>
        </div>

        <div id="game-over-screen" class="screen">
            <video id="gameover-video" autoplay muted loop playsinline>
                <source src="assets/videos/gameover.mp4" type="video/mp4">
            </video>
            <div class="game-over-content">
                <h2>Игра окончена</h2>
                <div id="final-score">Очки: 0</div>
                <input type="text" id="player-name" placeholder="Введите ваше имя" maxlength="20">
                <button id="save-score-btn" class="btn">Сохранить результат</button>
                <button id="restart-btn" class="btn">Начать заново</button>
                <button id="menu-btn" class="btn">Главное меню</button>
            </div>
        </div>

        <div id="victory-screen" class="screen">
            <video id="victory-video" autoplay muted loop playsinline>
                <source src="assets/videos/victory.mp4" type="video/mp4">
            </video>
            <div class="victory-content">
                <h2>Победа!</h2>
                <div id="victory-final-score">Очки: 0</div>
                <input type="text" id="victory-player-name" placeholder="Введите ваше имя" maxlength="20">
                <button id="victory-save-score-btn" class="btn">Сохранить результат</button>
                <button id="victory-restart-btn" class="btn">Начать заново</button>
                <button id="victory-menu-btn" class="btn">Главное меню</button>
            </div>
        </div>

        <div id="settings-screen" class="screen">
            <h2>Настройки</h2>
            <div class="setting-item">
                <label>Звук: <span id="sound-status">Вкл</span></label>
                <button id="toggle-sound-btn" class="btn">Переключить</button>
            </div>
            <button id="back-from-settings-btn" class="btn">Назад</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
