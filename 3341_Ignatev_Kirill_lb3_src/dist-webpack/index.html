<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администрирование социальной сети</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link href="css/app.e406c797d1c877be11a6.css" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container-fluid"><a class="navbar-brand" href="index.html">Социальная сеть</a> <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link active" href="index.html">Пользователи</a></li><li class="nav-item"><a class="nav-link" href="friends.html">Друзья</a></li><li class="nav-item"><a class="nav-link" href="news.html">Новости</a></li></ul></div></div></nav><div class="container-fluid mt-4"><div class="row justify-content-center align-items-start"><div class="col-lg-5 col-md-6"><div class="d-flex justify-content-between align-items-center mb-3"><h3>Список пользователей</h3></div><div class="table-responsive users-list-container"><table class="table table-striped table-hover table-sm"><thead class="table-dark"><tr><th>Фото</th><th>ФИО</th><th>Email</th><th>Роль</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="usersTableBody"></tbody></table></div></div><div class="col-lg-4 col-md-6"><div class="d-flex justify-content-between align-items-center mb-3"><h3 id="formTitle" class="mb-0">Добавить пользователя</h3><button type="button" class="btn btn-primary btn-sm" id="addUserBtn" onclick="resetForm()" style="display: none;">Добавить пользователя</button></div><div class="user-form-container"><div class="card"><div class="card-header"><h5 class="card-title mb-0" id="formTitleCard">Добавить пользоват
